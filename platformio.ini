; PlatformIO Project Configuration File
; PocketQube LoRa Triangulation Mission
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = groundstation_esp32c3

; ============================================
; Common settings
; ============================================
[env]
monitor_speed = 115200
upload_speed = 921600

; ============================================
; ESP32-C3 Super Mini (single-core)
; ============================================
[env:groundstation_esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
upload_protocol = esptool

build_flags =
    -D CORE_DEBUG_LEVEL=4
    -D CONFIG_FREERTOS_UNICORE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    enjoyneering/AHTxx @ ^1.2.0
    adafruit/Adafruit MPU6050 @ ^2.2.6
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^6.21.3

monitor_filters =
    esp32_exception_decoder
    colorize
    time

; ============================================
; Native unit tests (runs on host PC)
; ============================================
[env:native]
platform = native
test_framework = unity
build_flags =
    -I lib
