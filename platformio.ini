; PlatformIO Project Configuration File
; PocketQube LoRa Triangulation Mission
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = satellite_esp32

; ============================================
; Common settings for all environments
; ============================================
[env]
monitor_speed = 115200
upload_speed = 921600

; Libraries shared by all embedded targets (NOT used by [env:native])
[common_libs]
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    enjoyneering/AHTxx @ ^1.2.0
    adafruit/Adafruit MPU6050 @ ^2.2.6
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^6.21.3

; ============================================
; Satellite - ESP32 DevKit V1 (Dual-Core)
; ============================================
[env:satellite_esp32]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = default.csv

; Compiler flags for dual-core optimization
build_flags =
    -D SATELLITE_BUILD
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_FREERTOS_UNICORE=0        ; Enable dual-core
    -D CONFIG_ARDUINO_RUNNING_CORE=1    ; Arduino loop on Core 1
    -D CONFIG_ARDUINO_EVENT_RUNNING_CORE=1

lib_deps =
    ${common_libs.lib_deps}
    adafruit/Adafruit GPS Library @ ^1.7.4

monitor_filters =
    esp32_exception_decoder
    colorize

; ============================================
; Beacons - ESP32-C3 Super Mini (Single-Core)
; ============================================
[env:beacon_esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

; Compiler flags for C3
build_flags =
    -D BEACON_BUILD
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_FREERTOS_UNICORE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Os
    -D BEACON_MODE

lib_deps =
    ${common_libs.lib_deps}

monitor_filters =
    esp32_exception_decoder
    colorize

; ============================================
; Ground Station - ESP32-C3 Super Mini
; ============================================
[env:groundstation_esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

; Compiler flags for GS
build_flags =
    -D GROUNDSTATION_BUILD
    -D CORE_DEBUG_LEVEL=4               ; More verbose logging for GS
    -D CONFIG_FREERTOS_UNICORE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1        ; USB CDC for PC connection

lib_deps =
    ${common_libs.lib_deps}

monitor_filters =
    esp32_exception_decoder
    colorize
    time

; Upload via USB CDC (native)
upload_protocol = esptool

; ============================================
; Native unit tests (runs on host PC)
; ============================================
[env:native]
platform = native
test_framework = unity
build_flags =
    -I lib